name: DATA CORE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/data-core-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare pnpm lockfile
        run: npx --yes pnpm@10.11.1 install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Build
        run: npm run build

      - name: Behavior tests
        run: node --test tests/*.test.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Check DATA CORE browser scripts
        run: |
          node --check public/family/sw.js
          node --check public/family/family.js
          node --check public/data-core/app.js
          node --check public/data-core/award-image-cache.js
          node --check public/data-core/curriculum.js
          node --check public/admissions-web/renderer/counseling-ux.js
          node --check public/data-core/upload-queue.js
          node --check public/data-core/private-image-cache.js
          node --check public/data-core/library-thumbnail.js
          node --check public/data-core/work/hq-library.js
          node --check public/data-core/content.js
          node --check public/data-core/instagram-derivative.js
          node --check public/data-core/operations.js
          node --check public/data-core/roadmap.js
          node --check public/data-core/roadmap-model.js
          node --check public/data-core/roadmap-content.js
          node --check public/data-core/career-visual-content.js
          node --check public/data-core/career-visuals.js
          node --check public/data-core/admissions-model.js
          node --check public/data-core/occupation-image-concepts.js
          node --check public/admissions-web/renderer/app.js
          node --check public/admissions-web/renderer/guidelines.js
          node --check public/data-core/readiness.js
          node --check public/data-core/login.js
          node --check public/data-core/accounts.js
          node --check public/data-core/design-shell.js
          node --check public/data-core/work/kkumeum.js
          node --check public/data-core/work/kkumeum-analytics.js
          node --check public/data-core/work/kkumeum-notices.js
          node --check public/data-core/work/kkumeum-operations.js
          node --check public/admissions-web/renderer/data-core-upload-bridge.js

      - name: Wrangler deploy dry run
        run: npx wrangler deploy --dry-run
