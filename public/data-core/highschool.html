<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/data-core/fetch-share.js?v=20261015-share"></script>
  <title>고교 진학 상담 · HI5·ANiHi DATA CORE</title>
  <link rel="stylesheet" href="/data-core/styles.css?v=20260928-signup">
  <link rel="stylesheet" href="/data-core/layout-theme.css?v=20260909-bright-layout">
  <link rel="stylesheet" href="/data-core/design-tokens.css?v=20260913-soft-premium">
  <link rel="stylesheet" href="/data-core/design-system.css?v=20260928-approved-logo">
  <link rel="stylesheet" href="/data-core/mobile-app.css?v=20261009-mobile-app">
  <link rel="stylesheet" href="/data-core/highschool.css?v=20261016-hs5">
  <link rel="stylesheet" href="/data-core/highschool-report.css?v=20261016-hs5">
</head>
<body class="data-core-layout hs-page">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/data-core/counseling"><img class="core-logo" src="/data-core/assets/hi5-data-core-approved-v1.png" alt="Hi5·ANiHi DATA CORE" width="48" height="48"><div><strong>HI5·ANiHi</strong><small>DATA CORE</small></div></a>
      <nav class="nav" aria-label="상담용 메뉴">
        <div class="nav-group">
          <a class="nav-item" href="/data-core/counseling"><span class="nav-icon">⌂</span><span>상담용 홈</span></a>
          <a class="nav-item" href="/data-core/counseling/competitions"><span class="nav-icon">☆</span><span>공모전·실기대회</span></a>
          <a class="nav-item" href="/data-core/roadmap"><span class="nav-icon">◇</span><span>꿈·전공 로드맵</span></a>
          <a class="nav-item" href="/"><span class="nav-icon">◎</span><span>대학합격 로드맵</span></a>
          <a class="nav-item active" href="/data-core/highschool" aria-current="page"><span class="nav-icon">▣</span><span>고교 진학 상담</span></a>
          <a class="nav-item" href="/data-core/curriculum"><span class="nav-icon">◫</span><span>꿈을 향한 커리큘럼</span></a>
        </div>
      </nav>
      <div class="sidebar-bottom"><a class="back-link" href="/data-core/counseling">상담용 홈으로 돌아가기</a></div>
    </aside>
    <main class="main" id="main">
      <header class="topbar hs-topbar"><div><a class="hs-home" href="/data-core/counseling">← 상담용 홈</a><p class="eyebrow">HI5·ANiHi DATA CORE · 상담용</p><h1 id="hsTitle">고교 진학 상담</h1></div>
        <div class="hs-actions" id="hsActions"></div>
      </header>
      <p class="notice hidden" id="hsNotice" role="status" aria-live="polite"></p>

      <section id="hsList" aria-labelledby="hsTitle">
        <div class="hs-toolbar">
          <label class="hs-search"><span>학생 이름</span><input type="search" id="hsSearch" maxlength="40" placeholder="이름으로 찾기"></label>
          <label class="hs-filter" id="hsCampusFilterBox"><span>캠퍼스</span><select id="hsCampusFilter"></select></label>
          <button class="primary-btn" type="button" id="hsNewBtn">＋ 새 상담</button>
        </div>
        <div class="hs-rows" id="hsRows"><p class="hs-empty">불러오는 중…</p></div>
      </section>

      <form id="hsForm" class="hs-form" hidden novalidate>
        <fieldset class="hs-box"><legend>학생</legend>
          <div class="hs-grid">
            <label class="c6"><span>이름 <b class="req">필수</b></span><input name="name" maxlength="60" autocomplete="off" required></label>
            <label class="c6"><span>학교</span><input name="middleSchool" maxlength="40" placeholder="예: 상동중학교" autocomplete="off"></label>
            <label class="c6"><span>주소 <small>도로명주소 · 통학 시간 계산에 씁니다</small></span><input name="address" maxlength="120" autocomplete="off" placeholder="예: 경기도 부천시 원미구 ○○로 00"></label>
            <div class="c6 hs-campus-field"><span id="hsCampusLabel">캠퍼스</span><div class="hs-campus-chips" id="hsCampus" role="radiogroup" aria-labelledby="hsCampusLabel"></div></div>
          </div>
        </fieldset>

        <fieldset class="hs-box"><legend>지망 학교 <small>1~5지망</small></legend>
          <div class="hs-wishes" id="hsWishes"></div>
        </fieldset>

        <fieldset class="hs-box"><legend>성적표</legend>
          <div class="hs-photo">
            <label class="primary-btn hs-file">성적표 사진 넣기<input type="file" id="hsPhoto" accept="image/jpeg,image/png,image/webp" multiple></label>
            <p class="hs-hint" id="hsPhotoStatus"></p>
          </div>
        </fieldset>
      </form>

      <section id="hsReportView" hidden aria-label="상담 자료">
        <p class="hs-hint" id="hsSaveStatus" role="status" aria-live="polite"></p>
        <div class="hs-report-scroll"><div class="hs-report" id="hsReport"></div></div>
      </section>
    </main>
  </div>
  <script type="module" src="/data-core/highschool.js?v=20261016-hs5"></script>
</body>
</html>
