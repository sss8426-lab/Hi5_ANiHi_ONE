<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATA CORE 로그인</title>
  <meta name="theme-color" content="#f8faf9">
  <link rel="preload" as="image" href="/data-core/assets/login-highfive-v1.webp">
  <link rel="stylesheet" href="/data-core/login.css?v=20260928-signup">
</head>
<body class="login-page">
  <main class="login-shell">
    <img class="login-hero" src="/data-core/assets/login-highfive-v1.webp" width="1536" height="1024" fetchpriority="high" alt="교복을 입은 두 학생이 밝은 하늘 아래 뛰어오르며 하이파이브하는 모습">
    <header class="login-brand">
      <a href="/data-core" aria-label="HI5·ANiHi DATA CORE 홈"><strong>HI5·ANiHi</strong><span>DATA CORE</span></a>
    </header>
    <h1 class="visually-hidden">너와 나의 합격의 순간<br>하이파이브</h1>
    <section class="login-panel" aria-label="DATA CORE 계정 로그인">
      <div id="loginFormWrap">
        <h2 id="loginTitle">로그인</h2>
        <form id="loginForm">
          <label>로그인 ID<input id="loginId" name="loginId" autocomplete="username" required></label>
          <label>비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required></label>
          <p class="message" id="message" role="alert"></p>
          <button type="submit">로그인</button>
        </form>
        <div class="signup-entry"><button id="openSignup" class="text-btn" type="button">직원인증</button></div>
      </div>
      <div id="signupFormWrap" class="hidden">
        <p class="eyebrow">처음 사용하는 직원</p>
        <h2>직원인증 신청</h2>
        <p class="lead">신청 후 마스터 관리자가 수락하면 입력한 아이디와 비밀번호로 로그인할 수 있습니다.</p>
        <form id="signupForm" novalidate>
          <label>이름<input id="signupName" name="name" autocomplete="name" maxlength="40" required></label>
          <label>캠퍼스명<select id="signupCampus" name="campus" required><option value="">캠퍼스를 선택하세요</option></select></label>
          <label>직책<input id="signupPosition" name="position" list="signupPositions" maxlength="40" placeholder="예: 원장, 실장, 강사" required></label>
          <datalist id="signupPositions"><option value="원장"><option value="부원장"><option value="실장"><option value="강사"><option value="직원"></datalist>
          <label>아이디<input id="signupLoginId" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" placeholder="영문 소문자·숫자 4~30자" required></label>
          <label>비밀번호<input id="signupPassword" type="password" autocomplete="new-password" minlength="12" placeholder="12자 이상" required></label>
          <label>비밀번호 확인<input id="signupPasswordConfirm" type="password" autocomplete="new-password" minlength="12" required></label>
          <label>연락처<input id="signupPhone" name="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="010-0000-0000" required></label>
          <p class="message" id="signupMessage" role="alert"></p>
          <button type="submit">직원인증 신청</button>
        </form>
        <button id="closeSignup" class="text-btn back-btn" type="button">로그인으로 돌아가기</button>
      </div>
      <div id="signupDoneWrap" class="hidden">
        <p class="eyebrow">직원인증</p>
        <h2>신청이 접수되었습니다</h2>
        <p class="lead" id="signupDoneText">마스터 관리자가 수락하면 입력한 아이디와 비밀번호로 로그인할 수 있습니다.</p>
        <button id="signupDoneBack" type="button">로그인 화면으로</button>
      </div>
      <div id="passwordFormWrap" class="hidden">
        <p class="eyebrow">첫 로그인</p>
        <h2>비밀번호 변경</h2>
        <form id="passwordForm">
          <label>로그인 ID<input id="changeLoginId" name="username" autocomplete="username" readonly></label>
          <label>현재 비밀번호<input id="currentPassword" type="password" autocomplete="current-password" required></label>
          <label>새 비밀번호<input id="nextPassword" type="password" autocomplete="new-password" minlength="12" required></label>
          <label>새 비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
          <p class="message" id="passwordMessage" role="alert"></p>
          <button type="submit">변경 후 시작하기</button>
        </form>
        <button id="switchAccount" type="button">다른 계정으로 로그인</button>
      </div>
      <a class="back" href="/data-core/counseling">공개 상담 화면으로 돌아가기</a>
    </section>
  </main>
  <script type="module" src="/data-core/login.js?v=20260928-signup"></script>
</body>
</html>
