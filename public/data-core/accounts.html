<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATA CORE 계정 관리</title>
  <link rel="stylesheet" href="/data-core/styles.css">
  <link rel="stylesheet" href="/data-core/layout-theme.css?v=20260909-bright-layout">
  <link rel="stylesheet" href="/data-core/design-tokens.css?v=20260910-1">
  <link rel="stylesheet" href="/data-core/design-system.css?v=20260910-1">
  <link rel="stylesheet" href="/data-core/accounts.css?v=20260912-campus">
</head>
<body class="data-core-layout campus-accounts">
  <main class="accounts-shell">
    <header class="accounts-header">
      <div><p class="eyebrow">HI5·ANiHi DATA CORE</p><h1>캠퍼스 계정 관리</h1></div>
      <a class="ghost-btn link-btn" href="/data-core/operations">운영관리로 돌아가기</a>
    </header>
    <section class="notice hidden" id="notice"></section>
    <section class="campus-presence" aria-labelledby="presenceTitle">
      <div class="panel-head"><h2 id="presenceTitle">캠퍼스 접속 현황</h2><button id="presenceRefresh" class="ghost-btn" aria-label="접속 현황 새로고침" title="새로고침"><svg class="core-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/data-core/assets/core-icons.svg#RotateCcw"></use></svg></button></div>
      <dl class="presence-summary"><div><dt>전체 캠퍼스</dt><dd id="campusTotal">-</dd></div><div><dt>현재 접속</dt><dd id="campusOnline">-</dd></div><div><dt>오늘 로그인</dt><dd id="campusToday">-</dd></div></dl>
      <p id="presenceError" role="status"></p><div id="campusPresence" class="presence-grid"></div>
    </section>
    <section class="panel account-create" id="createPanel">
      <div class="panel-head"><div><h2>계정 만들기</h2><p>임시 비밀번호는 생성 직후 한 번만 표시됩니다.</p></div></div>
      <form id="createForm" class="account-form">
        <label>이름<input id="displayName" required></label>
        <label>로그인 ID<input id="loginId" required autocomplete="off"></label>
        <label>역할<select id="role"><option value="CAMPUS_ADMIN">캠퍼스 관리자</option><option value="MASTER">마스터 관리자</option><option value="TEACHER">교사 (기존)</option><option value="STAFF">직원 (기존)</option><option value="CAMPUS_DIRECTOR">캠퍼스 원장 (기존)</option></select></label>
        <label id="campusField">캠퍼스<select id="campusId"></select></label>
        <label>임시 비밀번호<input id="temporaryPassword" type="password" minlength="12" required autocomplete="new-password"></label>
        <button class="primary-btn" type="submit">계정 만들기</button>
      </form>
      <div class="temporary-password hidden" id="temporaryResult"></div>
    </section>
    <section class="panel"><div class="panel-head"><div><h2>계정 목록</h2><p>비활성화하거나 세션을 해제하면 해당 계정은 즉시 다시 로그인해야 합니다.</p></div><button class="ghost-btn" id="refreshBtn">새로고침</button></div>
      <div class="table-wrap"><table><thead><tr><th>이름</th><th>로그인 ID</th><th>권한</th><th>상태</th><th>마지막 로그인</th><th></th></tr></thead><tbody id="accountsBody"></tbody></table><div class="empty-state hidden" id="empty">표시할 계정이 없습니다.</div></div>
    </section>
    <section class="recent-logins"><h2>최근 로그인</h2><ul id="recentLogins"></ul></section>
  </main>
  <script type="module" src="/data-core/accounts.js?v=20260912-campus"></script>
  <script type="module" src="/data-core/design-shell.js?v=20260912-campus"></script>
</body>
</html>
